{% extends "index.html" %}
{% block content %}
<table>
        <caption>
            Events
        </caption>
        <thead>
            <tr>
                <th>
                    ID:
                </th>
                <th>
                    Name:
                </th>
                <th>
                    Type:
                </th>
            </tr>
        </thead>
        <tbody>
            {% for row in table %}
            <tr>
                <td>{{row[0]}}</td>
                <td>{{row[1]}}</td>
                <td>{{row[2]}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
